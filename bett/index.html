ct","kind":"句子","direction":"汉译英","source":"自动化提高了生产率，但短期内并未降低单位成本。","answer":"Automation has increased productivity, but it has not reduced unit costs in the short term.","units":["生产率提高","转折","短期单位成本未下降"],"note":"区分productivity与production，保留时间限定。","origin":"自编训练"},{"id":"W05","theme":"market","kind":"句子","direction":"英译汉","source":"The survey covered 800 urban consumers and does not represent all households in the province.","answer":"该调查覆盖800名城市消费者，不能代表全省所有家庭。","units":["800名","城市消费者","不能代表","全省家庭"],"note":"保留抽样范围和代表性限制。","origin":"自编训练"},{"id":"W06","theme":"market","kind":"句子","direction":"英译汉","source":"Its market share rose from 12% to 15%, an increase of three percentage points.","answer":"其市场份额从12%升至15%，提高了3个百分点。","units":["12%到15%","3个百分点"],"note":"不要把percentage points译为百分之三。","origin":"自编训练"},{"id":"W07","theme":"market","kind":"句子","direction":"汉译英","source":"较高的品牌知名度并不一定带来更多的重复购买。","answer":"Greater brand awareness does not necessarily lead to more repeat purchases.","units":["知名度较高","不一定","重复购买增加"],"note":"does not necessarily保留可能性，不改成必然不。","origin":"自编训练"},{"id":"W08","theme":"market","kind":"句子","direction":"汉译英","source":"为进入目标市场，公司计划先与当地零售商合作。","answer":"To enter its target market, the company plans to work with local retailers first.","units":["目标市场","计划","先","当地零售商"],"note":"计划是意向，不是已经完成的行为。","origin":"自编训练"},{"id":"W09","theme":"trade","kind":"句子","direction":"英译汉","source":"Please send the commercial invoice and packing list before the goods are dispatched.","answer":"请在货物发运前寄送商业发票和装箱单。","units":["商业发票","装箱单","发运前"],"note":"dispatch与抵达不是同一个节点。","origin":"自编训练"},{"id":"W10","theme":"trade","kind":"句子","direction":"英译汉","source":"The preferential tariff applies only to goods that meet the relevant rules of origin.","answer":"该优惠关税仅适用于符合相关原产地规则的货物。","units":["优惠关税","仅适用","符合相关原产地规则"],"note":"保留only，不扩大适用范围。","origin":"自编训练"},{"id":"W11","theme":"trade","kind":"句子","direction":"汉译英","source":"该报价以美元计价，有效期至11月15日。","answer":"The quotation is denominated in US dollars and is valid until November 15.","units":["报价","美元","11月15日到期"],"note":"原文无年份和具体时刻，不自行补足。","origin":"自编训练"},{"id":"W12","theme":"trade","kind":"句子","direction":"汉译英","source":"双方同意在合同中注明指定交货地点及贸易术语版本。","answer":"The parties agreed to specify the named place of delivery and the version of the trade rules in the contract.","units":["双方同意","合同中","指定交货地点","规则版本"],"note":"不自行选择FOB或其他具体规则。","origin":"自编训练"},{"id":"W13","theme":"logistics","kind":"句子","direction":"英译汉","source":"The shipment is expected to arrive on Friday, subject to customs clearance.","answer":"该批货物预计周五抵达，具体取决于清关情况。","units":["预计","周五抵达","受清关条件限制"],"note":"ETA不能译成保证到达。","origin":"自编训练"},{"id":"W14","theme":"logistics","kind":"句子","direction":"英译汉","source":"Transport costs fell by 8%, while the average delivery time remained unchanged.","answer":"运输成本下降了8%，平均交付时间则保持不变。","units":["成本下降8%","交付时间不变"],"note":"while在此是对照，不补充因果关系。","origin":"自编训练"},{"id":"W15","theme":"logistics","kind":"句子","direction":"汉译英","source":"仓库库存不足，首批货物将分两次发运。","answer":"Warehouse stocks are insufficient, so the first batch of goods will be dispatched in two shipments.","units":["库存不足","首批货物","两次发运"],"note":"先理解首批与分批的层级，避免译成两个订单。","origin":"自编训练"},{"id":"W16","theme":"logistics","kind":"句子","direction":"汉译英","source":"冷链记录显示，运输途中温度始终保持在规定范围内。","answer":"Cold-chain records show that the temperature remained within the specified range throughout transit.","units":["记录显示","全程","温度","规定范围内"],"note":"保留信息来源，不补出具体温度。","origin":"自编训练"},{"id":"W17","theme":"payment","kind":"句子","direction":"英译汉","source":"A 30% advance payment is due within five days of signing, with the balance payable before shipment.","answer":"签约后五日内应支付30%的预付款，尾款须在装运前支付。","units":["30%","签约后五日内","尾款","装运前"],"note":"预付款不自动译为具有特定担保效力的定金。","origin":"自编训练"},{"id":"W18","theme":"payment","kind":"句子","direction":"英译汉","source":"The buyer shall bear all bank charges outside the seller’s country.","answer":"卖方所在国以外的所有银行手续费由买方承担。","units":["买方承担","全部手续费","卖方所在国以外"],"note":"地点修饰的是手续费发生范围。","origin":"自编训练"},{"id":"W19","theme":"payment","kind":"句子","direction":"汉译英","source":"汇率变动可能增加进口商的成本，但目前无法确定影响程度。","answer":"Exchange rate movements may increase the importer’s costs, but the extent of the impact is not yet clear.","units":["可能","进口商成本增加","目前","程度未明"],"note":"不把may升级为will。","origin":"自编训练"},{"id":"W20","theme":"payment","kind":"句子","direction":"汉译英","source":"请在汇款时注明发票号码，以便我们核对款项。","answer":"Please quote the invoice number when making the remittance so that we can identify the payment.","units":["汇款时","注明发票号","核对款项"],"note":"quote在此是注明，不是报价。","origin":"自编训练"},{"id":"W21","theme":"finance","kind":"句子","direction":"英译汉","source":"Revenue rose by 15% to 46 million yuan, but net profit fell because distribution costs increased.","answer":"营业收入增长15%，达到4600万元，但净利润因分销成本上升而下降。","units":["收入增长15%","达到4600万元","净利润下降","原因是分销成本上升"],"note":"by译增幅，to译终值；原文因果需要保留。","origin":"自编训练"},{"id":"W22","theme":"finance","kind":"句子","direction":"英译汉","source":"Positive earnings do not necessarily mean that operating cash flow is positive.","answer":"盈利并不一定意味着经营活动现金流量为正。","units":["盈利","不一定","经营活动现金流为正"],"note":"区分利润与现金流。","origin":"自编训练"},{"id":"W23","theme":"finance","kind":"句子","direction":"汉译英","source":"公司计划把预算的四分之一用于研发，而不是设备采购。","answer":"The company plans to allocate a quarter of its budget to research and development rather than equipment purchases.","units":["计划","预算四分之一","研发","不是采购设备"],"note":"四分之一是25%，不是四分之一百分点。","origin":"自编训练"},{"id":"W24","theme":"finance","kind":"句子","direction":"汉译英","source":"该报告中的利润率为初步估计，尚未经审计。","answer":"The profit margin in the report is a preliminary estimate and has not yet been audited.","units":["利润率","初步估计","尚未经审计"],"note":"不能擅自明确为净利率或毛利率。","origin":"自编训练"},{"id":"W25","theme":"legal","kind":"句子","direction":"英译汉","source":"Either party may terminate the agreement by giving the other party 30 days’ written notice.","answer":"任何一方均可提前30日书面通知另一方终止本协议。","units":["任何一方","可以","提前30日","书面通知","另一方"],"note":"may是权利而非必须终止的义务。","origin":"自编训练"},{"id":"W26","theme":"legal","kind":"句子","direction":"英译汉","source":"The confidentiality obligation survives termination of this agreement.","answer":"本协议终止后，保密义务仍然有效。","units":["保密义务","协议终止后","继续有效"],"note":"survives按法律功能处理，不直译为幸存。","origin":"自编训练"},{"id":"W27","theme":"legal","kind":"句子","direction":"汉译英","source":"除非双方另有书面约定，未经许可不得披露客户信息。","answer":"Unless the parties otherwise agree in writing, customer information must not be disclosed without permission.","units":["除非","双方另有书面约定","未经许可","不得披露"],"note":"保留例外、书面形式和否定。","origin":"自编训练"},{"id":"W28","theme":"legal","kind":"句子","direction":"汉译英","source":"这家子公司独立签订采购合同，母公司不是合同当事人。","answer":"The subsidiary entered into the purchase contract in its own name; the parent company is not a party to the contract.","units":["子公司独立签约","母公司","非合同当事人"],"note":"不要混淆子公司与分公司，也不推导其他担保责任。","origin":"自编训练"},{"id":"W29","theme":"negotiation","kind":"句子","direction":"英译汉","source":"We can offer a 5% discount if the order reaches 2,000 units and payment is made in advance.","answer":"如订单达到2000件且提前付款，我们可以给予5%的折扣。","units":["可以","折扣5%","订单至少2000件","且提前付款"],"note":"两个条件用and连接，不能漏掉一个。","origin":"自编训练"},{"id":"W30","theme":"negotiation","kind":"句子","direction":"英译汉","source":"The two sides reached a tentative agreement, subject to approval by their respective boards.","answer":"双方达成初步协议，尚须各自董事会批准。","units":["初步协议","各自董事会批准"],"note":"不能写成正式生效或已获批准。","origin":"自编训练"},{"id":"W31","theme":"negotiation","kind":"句子","direction":"汉译英","source":"我们愿意讨论交货时间，但目前不能承诺进一步降价。","answer":"We are willing to discuss the delivery schedule, but we cannot commit to any further price reduction at this stage.","units":["愿讨论交期","目前","不能承诺","进一步降价"],"note":"维持礼貌且不削弱拒绝承诺的含义。","origin":"自编训练"},{"id":"W32","theme":"negotiation","kind":"句子","direction":"汉译英","source":"请确认代表团人数和抵达时间，以便我们安排接待。","answer":"Please confirm the size of the delegation and its arrival time so that we can make the necessary reception arrangements.","units":["确认人数","抵达时间","安排接待"],"note":"size在代表团语境是人数。","origin":"自编训练"},{"id":"W33","theme":"digital","kind":"句子","direction":"英译汉","source":"The platform’s commission is calculated on sales after refunds, not on the number of orders.","answer":"该平台的佣金按扣除退款后的销售额计算，而不是按订单数量计算。","units":["平台佣金","扣退款后销售额","非订单数量"],"note":"分清计费基数，commission不是委员会。","origin":"自编训练"},{"id":"W34","theme":"digital","kind":"句子","direction":"英译汉","source":"The new tool can draft replies, but every message must be reviewed by a human before it is sent.","answer":"新工具可以起草回复，但每条信息发送前都必须经人工审核。","units":["可起草","每条","发送前","必须人工审核"],"note":"能力与义务同时保留。","origin":"自编训练"},{"id":"W35","theme":"digital","kind":"句子","direction":"汉译英","source":"退货率下降并不意味着所有顾客都对产品满意。","answer":"A lower return rate does not mean that all customers are satisfied with the product.","units":["退货率降低","不意味着","所有顾客满意"],"note":"不要把not all写成none。","origin":"自编训练"},{"id":"W36","theme":"digital","kind":"句子","direction":"汉译英","source":"商家应向消费者清楚说明订阅费用和取消方式。","answer":"Merchants should clearly explain the subscription fees and cancellation process to consumers.","units":["商家","应清楚说明","订阅费用","取消方式"],"note":"翻译should，不据此补充具体法律制裁。","origin":"自编训练"},{"id":"W37","theme":"news","kind":"句子","direction":"英译汉","source":"According to preliminary data, exports grew by 6.2% year on year in the first quarter.","answer":"初步数据显示，第一季度出口同比增长6.2%。","units":["初步数据","第一季度","出口","同比6.2%"],"note":"不省略according to、preliminary和year on year。","origin":"自编训练"},{"id":"W38","theme":"news","kind":"句子","direction":"英译汉","source":"Analysts expect demand to recover gradually, although uncertainty remains high.","answer":"分析人士预计需求将逐步恢复，但不确定性仍然较高。","units":["分析人士预计","逐步","不确定性较高"],"note":"不能变成需求已经恢复。","origin":"自编训练"},{"id":"W39","theme":"news","kind":"句子","direction":"汉译英","source":"该机构预计明年经济增长将放缓，而不是出现负增长。","answer":"The institution expects economic growth to slow next year rather than turn negative.","units":["该机构预计","明年","增速放缓","非负增长"],"note":"slow growth不是contraction。","origin":"自编训练"},{"id":"W40","theme":"news","kind":"句子","direction":"汉译英","source":"截至6月底，该项目已吸引超过120家中小企业参与。","answer":"By the end of June, the project had attracted more than 120 small and medium-sized enterprises.","units":["截至6月底","超过120家","中小企业","已参与"],"note":"more than不改为about，不擅自添加年份。","origin":"自编训练"},{"id":"W41","theme":"green","kind":"句子","direction":"英译汉","source":"The company aims to cut emissions per unit of output by 20% from the 2020 baseline.","answer":"该公司力争将单位产出的排放量较2020年基准水平降低20%。","units":["目标","单位产出排放","2020年基准","降低20%"],"note":"强度下降不等于总量下降。","origin":"自编训练"},{"id":"W42","theme":"green","kind":"句子","direction":"英译汉","source":"The sustainability report discloses energy use but does not provide third-party verification.","answer":"该可持续发展报告披露了能源使用情况，但未提供第三方核验。","units":["披露能源使用","未提供","第三方核验"],"note":"披露、核验和认证不能互相代替。","origin":"自编训练"},{"id":"W43","theme":"green","kind":"句子","direction":"汉译英","source":"可重复使用的包装是否节约成本，取决于回收次数和运输距离。","answer":"Whether reusable packaging saves costs depends on the number of reuse cycles and the transport distance.","units":["是否节省","重复使用次数","运输距离","取决于"],"note":"不要预先断言一定节约。","origin":"自编训练"},{"id":"W44","theme":"green","kind":"句子","direction":"汉译英","source":"该计划目前只覆盖直接供应商，尚未延伸至整个供应链。","answer":"The programme currently covers only direct suppliers and has not yet been extended to the entire supply chain.","units":["目前","仅直接供应商","尚未","全供应链"],"note":"范围限制是核心信息。","origin":"自编训练"},{"id":"W45","theme":"culture","kind":"句子","direction":"英译汉","source":"The exhibition introduces the Tea Horse Road through objects, photographs and oral histories.","answer":"该展览通过实物、照片和口述历史介绍茶马古道。","units":["展览","茶马古道","实物照片口述历史"],"note":"不将介绍改写为证明或重建完整历史。","origin":"自编训练"},{"id":"W46","theme":"culture","kind":"句子","direction":"英译汉","source":"The cooperative sells green coffee beans, while local partners handle roasting and retailing.","answer":"该合作社销售咖啡生豆，烘焙和零售则由当地合作伙伴负责。","units":["合作社","生豆","当地伙伴","烘焙零售"],"note":"green coffee不是绿颜色咖啡或绿色认证咖啡。","origin":"自编训练"},{"id":"W47","theme":"culture","kind":"句子","direction":"汉译英","source":"这个项目鼓励社区参与，但具体的利益分享办法尚在协商。","answer":"The project encourages community participation, but the specific benefit-sharing arrangements are still being negotiated.","units":["鼓励参与","具体利益分享","尚在协商"],"note":"不可添加已经取得社区同意。","origin":"自编训练"},{"id":"W48","theme":"culture","kind":"句子","direction":"汉译英","source":"云南企业希望通过区域合作，提高特色农产品的附加值。","answer":"Yunnan enterprises hope to increase the added value of distinctive agricultural products through regional cooperation.","units":["云南企业希望","区域合作","特色农产品","附加值"],"note":"hope保留意愿，不写成已实现。","origin":"自编训练"},{"id":"W49","theme":"product","kind":"篇章","direction":"英译汉","source":"A small manufacturer has introduced automated packing equipment to reduce errors. During a three-month trial, output per worker increased by 12%, while the defect rate fell from 2% to 1.5%. The production manager said that these results were encouraging, but warned against treating them as a forecast for the full year. The trial covered only one product line, and staff received additional training during the same period. Before expanding the programme, the company will compare maintenance costs, energy use and customer complaints across different lines.","answer":"一家小型制造企业引入了自动包装设备以减少差错。在为期三个月的试用中，人均产出提高了12%，缺陷率从2%降至1.5%。生产经理表示，结果令人鼓舞，但提醒不要将其视为全年业绩预测。试用仅涉及一条产品线，同期员工还接受了额外培训。扩大该项目之前，公司将比较不同产品线的维护成本、能源消耗和客户投诉情况。","units":["自动包装减少差错","三个月","人均产出增12%","缺陷率2%至1.5%","经理提醒非全年预测","一条线及同期培训","扩展前比较三项指标"],"note":"这段有混杂因素：同时培训。译文不应替原文证明自动化的独立因果效果。","origin":"自编训练"},{"id":"W50","theme":"market","kind":"篇章","direction":"汉译英","source":"一家本地茶企调查了500名参加展会的消费者。调查发现，年轻受访者更关注包装设计，但价格仍然是多数人购买时考虑的重要因素。公司据此决定测试两种新包装，而不是立即提高所有产品的价格。营销经理指出，展会访客可能比普通消费者更了解茶叶，因此调查结果还需要在其他销售渠道中验证。","answer":"A local tea company surveyed 500 consumers attending a trade fair. The survey found that younger respondents paid more attention to packaging design, but price remained an important consideration for most buyers. On this basis, the company decided to test two new packaging designs rather than immediately raise the prices of all its products. The marketing manager noted that trade fair visitors might know more about tea than ordinary consumers, so the findings would need to be tested through other sales channels.","units":["500名展会消费者","年轻受访者关注包装","价格仍重要","测试两种包装","不立即全面涨价","样本限制需验证"],"note":"保留respondents范围；“更关注”不等于愿支付更高价格。","origin":"自编训练"},{"id":"W51","theme":"trade","kind":"篇章","direction":"英译汉","source":"An exporter received an order for 800 cartons of dried fruit. The buyer requested a commercial invoice, a packing list and a certificate of origin. Although the parties had agreed on the price, their draft contract did not identify the version of the trade rules or the named place of delivery. The exporter therefore asked for clarification before arranging transport. Both sides also agreed to check whether the goods qualified for a preferential tariff. No claim of eligibility would be made until the relevant documents had been reviewed.","answer":"一家出口商收到800箱果干的订单。买方要求提供商业发票、装箱单和原产地证书。尽管双方已商定价格，合同草案却未注明贸易术语规则的版本或指定交货地点。因此，出口商在安排运输前要求进一步说明。双方还同意核查该批货物是否符合优惠关税条件。在相关文件审查完成前，不会声明该货物具备适用资格。","units":["800箱果干","三种单证","已定价","未明确规则版本和地点","运输前澄清","核查优惠关税","审查前不声明符合"],"note":"不要替合同选定贸易术语；不要把待核资格译成已获优惠。","origin":"自编训练"},{"id":"W52","theme":"logistics","kind":"篇章","direction":"汉译英","source":"物流企业把一部分库存转移至距客户更近的仓库，以缩短配送时间。试运行期间，平均配送时间由四天缩短为三天，但仓储费用上升。公司尚未决定是否在所有地区推广这一安排。负责人表示，偏远地区的订单密度较低，新的仓储模式未必适用。下一阶段的评估将同时考察成本、准时交付率和顾客投诉。","answer":"A logistics company moved part of its inventory to warehouses closer to customers to shorten delivery times. During the trial, average delivery time fell from four days to three, but warehousing costs increased. The company has not yet decided whether to extend the arrangement to all regions. Its manager said that order density was lower in remote areas, where the new warehousing model might not be suitable. The next evaluation will consider costs, on-time delivery rates and customer complaints together.","units":["部分库存","靠近客户","四天至三天","仓储成本增加","未决定全面推广","偏远订单密度低","三项评估"],"note":"不能把时间缩短与成本下降同时写成已实现成果。","origin":"自编训练"},{"id":"W53","theme":"payment","kind":"篇章","direction":"英译汉","source":"The contract requires a 20% advance payment and payment of the balance before shipment. When the buyer asked to pay the balance after arrival, the seller did not immediately reject the request. Instead, it asked for information about the buyer’s payment record and proposed a smaller trial order. The finance team explained that a larger order would increase working capital requirements. Any revised arrangement would have to be confirmed in writing, including the currency, due date and allocation of bank charges.","answer":"合同规定预付20%的货款，尾款在装运前支付。买方要求货到后付清尾款时，卖方没有立即拒绝，而是要求了解买方以往的付款记录，并建议先做一笔较小的试订单。财务团队解释说，订单扩大将增加营运资金需求。任何修改后的安排都须书面确认，包括币种、付款到期日及银行手续费的分担。","units":["20%预付","装运前尾款","请求货到付","未立即拒绝","付款记录与小额试单","营运资金","书面确认三项"],"note":"提出建议不是已达成新付款协议。","origin":"自编训练"},{"id":"W54","theme":"finance","kind":"篇章","direction":"汉译英","source":"某公司上半年营业收入为6000万元，同比增长20%，但净利润与去年同期基本持平。管理层解释，物流和市场推广支出增加，抵消了部分收入增长带来的收益。与此同时，应收账款上升，经营活动现金流量下降。公司计划加强回款管理，但强调不会仅为改善短期现金流而停止向所有客户提供商业信用。","answer":"A company reported revenue of 60 million yuan for the first half of the year, up 20% year on year, while net profit was broadly unchanged. Management explained that higher logistics and marketing expenses had offset part of the gains from revenue growth. Meanwhile, accounts receivable increased and operating cash flow declined. The company plans to improve its collection of payments, but stressed that it would not stop extending trade credit to all customers merely to improve short-term cash flow.","units":["上半年6000万元","同比20%","净利润基本持平","两类成本抵消收益","应收增加现金流下降","计划回款","不全面停止赊销"],"note":"trade credit为商业信用/赊销；不要用利润增长替代收入增长。","origin":"自编训练"},{"id":"W55","theme":"legal","kind":"篇章","direction":"英译汉","source":"A supplier and a distributor signed a two-year agreement. The distributor received exclusive rights in one city, but not across the whole province. The agreement allowed either party to terminate it on 30 days’ written notice. It also required both parties to protect customer information after termination. A later email suggested expanding the territory, but the agreement required changes to be signed by both parties. The two companies therefore arranged a meeting to discuss an amendment rather than assuming that the email had settled the matter.","answer":"一家供应商与一家经销商签订了为期两年的协议。经销商取得了某一城市的独家经销权，并非全省独家经销权。协议允许任何一方提前30日书面通知终止协议，同时要求双方在协议终止后继续保护客户信息。后来一封邮件建议扩大区域，但协议要求修改内容须经双方签署。因此，两家公司安排会议讨论修订事宜，没有直接认为该邮件已解决这一问题。","units":["两年","某市非全省","任一方提前30日书面通知","终止后保密","邮件建议","变更要求双方签署","安排修订会议"],"note":"只翻译题设事实，不自行下邮件法律效力的普遍结论。","origin":"自编训练"},{"id":"W56","theme":"negotiation","kind":"篇章","direction":"汉译英","source":"在商务洽谈中，买方要求降低单价并缩短交货期。卖方表示，如果订单达到3000件，可以给予3%的折扣，但需要保持原定的交货安排。双方同意先确认产品规格和付款方式，再讨论长期合作。会议结束时，双方仅形成了初步共识，尚未签署正式合同。会后邮件应准确记录已经商定的内容和仍需协商的问题。","answer":"During a business negotiation, the buyer requested a lower unit price and a shorter delivery period. The seller said it could offer a 3% discount if the order reached 3,000 units, but would need to keep the original delivery schedule. The parties agreed to confirm the product specifications and payment method before discussing long-term cooperation. By the end of the meeting, they had reached only a preliminary understanding and had not signed a formal contract. The follow-up email should accurately record what had been agreed and what remained open for discussion.","units":["买方双重要求","3000件条件","3%折扣","保持交期","先规格付款后长期合作","仅初步共识","邮件分清已定未定"],"note":"保留让步交换关系，不能误成既降价又缩短交期。","origin":"自编训练"},{"id":"W57","theme":"digital","kind":"篇章","direction":"英译汉","source":"An online seller used an AI tool to prepare product descriptions in English. The first drafts were fluent, but several claims about materials and delivery times were not supported by the source information. The seller introduced a review process: staff checked numbers, product specifications and promises before publication. Customer questions were then used to improve the descriptions. The company reported fewer requests for clarification after the change, but said that it was too early to measure the effect on sales.","answer":"一家线上商家使用AI工具撰写英文产品说明。初稿语言流畅，但关于材料和交货时间的若干表述缺乏原始信息支持。商家随后建立了审核流程，由员工在发布前核对数字、产品规格和承诺内容，再利用顾客的问题改进说明。公司表示，调整后要求进一步说明的咨询减少了，但评估其对销量的影响还为时过早。","units":["AI写英文说明","流畅但有无依据表述","发布前人工核对三项","利用顾客问题改写","澄清请求减少","销量效应尚早"],"note":"不要把“更少澄清”当成“销售提高”的证据。","origin":"自编训练"},{"id":"W58","theme":"news","kind":"篇章","direction":"汉译英","source":"初步数据显示，该地区前三季度服务贸易保持增长。当地商务部门表示，旅游和数字服务是主要推动因素，但不同企业的恢复情况并不一致。一些中小企业仍面临融资和人才方面的困难。分析人士预计，未来几个月需求可能继续改善，同时提醒外部市场存在不确定性。这些判断属于预测，不能作为已经实现的增长结果。","answer":"Preliminary data show that trade in services in the region continued to grow in the first three quarters. The local commerce authority said that tourism and digital services were the main drivers, but that recovery varied across companies. Some small and medium-sized enterprises still faced difficulties in financing and recruitment. Analysts expect demand may improve further in the coming months, while warning of uncertainty in external markets. These assessments are forecasts and should not be treated as growth that has already been achieved.","units":["初步数据","前三季度","服务贸易增长","部门归因两因素","企业差异","融资人才困难","分析人士预测及不确定性"],"note":"信息分属数据、部门解释、分析预测三个层次。","origin":"自编训练"},{"id":"W59","theme":"green","kind":"篇章","direction":"英译汉","source":"A food exporter replaced some single-use boxes with reusable containers. Its first report showed a reduction in packaging waste per shipment, but did not include the energy used to return and clean the containers. The sustainability team said that the project should be assessed over its full life cycle. It also distinguished the company’s own estimate from independent verification. Before describing the system as lower-carbon, the exporter plans to collect data on transport distances, reuse cycles and cleaning methods.","answer":"一家食品出口商用可重复使用的容器替代了部分一次性包装箱。首份报告显示，每批货物的包装废弃物减少了，但未计入容器回运和清洗所消耗的能源。可持续发展团队表示，应从完整生命周期评估该项目，同时区分企业自行估计与独立核验。出口商计划先收集运输距离、重复使用次数和清洗方式的数据，再将该系统描述为更低碳的方案。","units":["部分替代","每批废物减少","未计回运清洗","完整生命周期","自估非独立核验","三项数据","低碳描述在后"],"note":"不能把报告的边界限制删除，或自行加环保认证。","origin":"自编训练"},{"id":"W60","theme":"culture","kind":"篇章","direction":"汉译英","source":"一家云南咖啡合作社正在为海外采购商制作双语介绍。材料需要说明咖啡豆的产地、加工方式和可追溯记录，同时避免使用无法证明的品质承诺。合作社还希望介绍当地种植者的知识与经验，但应先确认相关故事的使用方式。翻译人员的任务是准确组织这些信息，不能因为希望材料更有吸引力，就擅自增加认证、历史传承或收益保证。","answer":"A coffee cooperative in Yunnan is preparing a bilingual introduction for overseas buyers. The material needs to explain where the beans come from, how they are processed and what traceability records are available, while avoiding unsupported quality promises. The cooperative also hopes to introduce local growers’ knowledge and experience, but should first confirm how the relevant stories may be used. Translators need to organize this information accurately, without adding certifications, claims of historical continuity or guarantees of returns merely to make the material more appealing.","units":["云南合作社","海外买家","产地加工追溯","避免无证品质承诺","当地知识故事使用先确认","不可增认证历史收益保证"],"note":"区分事实翻译与宣传润色，尤其保留知识来源与承诺边界。","origin":"自编训练"}],"interpreting":[{"id":"O01","theme":"negotiation","title":"展会询价与让步","kind":"双向对话","segments":[{"source":"Welcome to our booth. Are you interested in our new packaging line?","answer":"欢迎来到我们的展位。您对我们的新包装产品系列感兴趣吗？","lang":"en-US","units":["欢迎","展位","新包装系列"]},{"source":"我们想先了解价格和最低起订量。","answer":"We would first like to know the price and the minimum order quantity.","lang":"zh-CN","units":["先了解","价格","最低起订量"]},{"source":"The unit price is eight US dollars, and the minimum order is five hundred units.","answer":"单价为8美元，最低起订量为500件。","lang":"en-US","units":["单价8美元","500件"]},{"source":"如果订购一千件，能否给予折扣？","answer":"Could you offer a discount if we order one thousand units?","lang":"zh-CN","units":["条件1000件","询问折扣"]},{"source":"We can offer three percent off, provided you keep the standard packaging.","answer":"如果采用标准包装，我们可以给予3%的折扣。","lang":"en-US","units":["可降3%","条件标准包装"]},{"source":"我们需要内部讨论，今天还不能确认订单。","answer":"We need to discuss it internally and cannot confirm the order today.","lang":"zh-CN","units":["需内部讨论","今天不能确认"]}],"origin":"自编训练"},{"id":"O02","theme":"payment","title":"付款方式的磋商","kind":"双向对话","segments":[{"source":"We normally require a thirty percent advance payment.","answer":"我们通常要求预付30%的货款。","lang":"en-US","units":["通常","30%预付"]},{"source":"尾款是在装运前支付，还是在货物抵达后支付？","answer":"Is the balance payable before shipment or after the goods arrive?","lang":"zh-CN","units":["尾款","装运前还是抵达后"]},{"source":"Before shipment. We will send photographs and the inspection report first.","answer":"在装运前。我们会先发送照片和检验报告。","lang":"en-US","units":["装运前","先照片和检验报告"]},{"source":"我们希望先做一笔小额订单，以建立信任。","answer":"We would like to start with a small order to build trust.","lang":"zh-CN","units":["希望","小额试单","建立信任"]},{"source":"That is acceptable, but the currency and bank charges must be agreed in writing.","answer":"可以，但币种及银行手续费必须书面约定。","lang":"en-US","units":["接受","币种","手续费","书面"]},{"source":"请把修订后的付款条件发给我们确认。","answer":"Please send us the revised payment terms for confirmation.","lang":"zh-CN","units":["修订付款条件","发来确认"]}],"origin":"自编训练"},{"id":"O03","theme":"logistics","title":"交货延迟与补救","kind":"双向对话","segments":[{"source":"The first shipment was due on Monday, but it has not arrived.","answer":"首批货物原定周一抵达，但目前尚未到达。","lang":"en-US","units":["首批","周一","未抵达"]},{"source":"很抱歉，承运人报告港口出现拥堵。","answer":"We are sorry. The carrier has reported congestion at the port.","lang":"zh-CN","units":["承运人报告","港口拥堵"]},{"source":"Can you guarantee delivery by Friday?","answer":"您能保证周五前交货吗？","lang":"en-US","units":["询问保证","周五前"]},{"source":"目前只能提供预计时间，不能作出保证。","answer":"At this stage, we can only provide an estimate, not a guarantee.","lang":"zh-CN","units":["目前","仅预计","不保证"]},{"source":"Please send a revised schedule and explain the options for urgent items.","answer":"请发送修订后的时间表，并说明急需货物有哪些可选安排。","lang":"en-US","units":["修订计划","急需货物","备选安排"]},{"source":"我们会今天回复，并分别列出额外费用。","answer":"We will reply today and list the additional charges separately.","lang":"zh-CN","units":["今天回复","额外费用单列"]}],"origin":"自编训练"},{"id":"O04","theme":"culture","title":"云南咖啡采购会谈","kind":"双向对话","segments":[{"source":"我们销售咖啡生豆，可以提供批次追溯记录。","answer":"We sell green coffee beans and can provide batch traceability records.","lang":"zh-CN","units":["生豆","可提供","批次追溯"]},{"source":"Do you also roast the beans for overseas customers?","answer":"你们也为海外客户烘焙咖啡豆吗？","lang":"en-US","units":["询问","海外客户","烘焙"]},{"source":"目前不提供烘焙服务，但可以介绍当地合作伙伴。","answer":"We do not currently offer roasting services, but can introduce local partners.","lang":"zh-CN","units":["目前不烘焙","可介绍本地伙伴"]},{"source":"We need two samples, each weighing five hundred grams.","answer":"我们需要两份样品，每份500克。","lang":"en-US","units":["两份","每份500克"]},{"source":"样品下周寄出，运费由买方承担。","answer":"The samples will be sent next week, with freight payable by the buyer.","lang":"zh-CN","units":["下周","运费","买方"]},{"source":"Please include the processing method and harvest year in the documents.","answer":"请在文件中注明加工方式和采收年份。","lang":"en-US","units":["文件","加工方式","采收年"]}],"origin":"自编训练"},{"id":"O05","theme":"digital","title":"电商平台服务沟通","kind":"双向对话","segments":[{"source":"How is your platform commission calculated?","answer":"你们平台的佣金如何计算？","lang":"en-US","units":["询问","佣金","计算方式"]},{"source":"按扣除退款后的销售额计算，不按订单数量计算。","answer":"It is calculated on sales after refunds, not on the number of orders.","lang":"zh-CN","units":["扣退款后销售额","非订单量"]},{"source":"Does the service include product translation?","answer":"这项服务包含产品翻译吗？","lang":"en-US","units":["是否包含","产品翻译"]},{"source":"包含初稿，但发布前需要商家确认规格和承诺。","answer":"It includes a first draft, but merchants need to confirm specifications and promises before publication.","lang":"zh-CN","units":["初稿","发布前","商家确认规格承诺"]},{"source":"Can we cancel the subscription at any time?","answer":"我们可以随时取消订阅吗？","lang":"en-US","units":["可否","随时","取消订阅"]},{"source":"可以取消，但已支付费用的退款条件需要另行查看。","answer":"You can cancel, but you need to check the refund conditions for fees already paid.","lang":"zh-CN","units":["可取消","已付费用","退款条件另查"]}],"origin":"自编训练"},{"id":"O06","theme":"green","title":"供应链披露与核验","kind":"双向对话","segments":[{"source":"贵公司的报告是否覆盖全部供应商？","answer":"Does your company’s report cover all suppliers?","lang":"zh-CN","units":["报告","是否","全部供应商"]},{"source":"It currently covers direct suppliers only.","answer":"目前只覆盖直接供应商。","lang":"en-US","units":["目前","仅","直接供应商"]},{"source":"这些数据是否经过第三方核验？","answer":"Have these data been verified by a third party?","lang":"zh-CN","units":["数据","是否","第三方核验"]},{"source":"Not yet. The figures are based on our internal records.","answer":"尚未。这些数字基于我们的内部记录。","lang":"en-US","units":["尚未","数字","内部记录"]},{"source":"请在材料中保留这个说明，避免让读者误解。","answer":"Please retain this explanation in the material to avoid misleading readers.","lang":"zh-CN","units":["保留说明","避免误解"]},{"source":"We agree, and we will update the report after verification.","answer":"我们同意，并将在核验后更新报告。","lang":"en-US","units":["同意","核验后","更新"]}],"origin":"自编训练"},{"id":"O07","theme":"finance","title":"经营业绩简报","kind":"英译汉篇章","segments":[{"source":"Thank you for joining today’s briefing. First-half revenue reached sixty million yuan, up twenty percent year on year.","answer":"感谢各位参加今天的简报会。上半年营业收入达到6000万元，同比增长20%。","lang":"en-US","units":["上半年","6000万元","同比20%"]},{"source":"Net profit was broadly unchanged because higher logistics and marketing costs offset part of the gains.","answer":"净利润基本持平，因为物流和营销成本上升抵消了部分收益。","lang":"en-US","units":["净利基本持平","物流营销成本","抵消"]},{"source":"Operating cash flow declined as accounts receivable increased. The finance team is reviewing payment terms.","answer":"应收账款增加，经营活动现金流量下降。财务团队正在审查付款条件。","lang":"en-US","units":["应收增加","经营现金流下降","审查付款条件"]},{"source":"These figures are preliminary. We will publish the audited results when the review is complete.","answer":"这些数字为初步数据。审查完成后，我们将公布经审计的结果。","lang":"en-US","units":["初步","审查完成后","公布审计结果"]}],"origin":"自编训练"},{"id":"O08","theme":"news","title":"服务贸易情况介绍","kind":"汉译英篇章","segments":[{"source":"初步数据显示，本地区前三季度服务贸易继续增长。","answer":"Preliminary data show that trade in services in our region continued to grow in the first three quarters.","lang":"zh-CN","units":["初步数据","本地区","前三季度","服务贸易增长"]},{"source":"旅游和数字服务发挥了重要作用，但不同企业的恢复情况并不一致。","answer":"Tourism and digital services played an important role, but recovery varied across companies.","lang":"zh-CN","units":["旅游数字服务","重要作用","恢复不一"]},{"source":"一些中小企业仍面临融资和人才方面的困难。","answer":"Some small and medium-sized enterprises still face difficulties in financing and recruitment.","lang":"zh-CN","units":["一些","中小企业","融资人才困难"]},{"source":"我们将继续完善支持措施。对于未来需求，目前只能作出审慎预测。","answer":"We will continue to improve support measures. For now, we can only make cautious forecasts about future demand.","lang":"zh-CN","units":["继续完善支持","目前","审慎预测需求"]}],"origin":"自编训练"},{"id":"O09","theme":"market","title":"消费者调查结果","kind":"英译汉篇章","segments":[{"source":"Our survey covered eight hundred consumers in three cities. It was not designed to represent the whole country.","answer":"本次调查覆盖三个城市的800名消费者，并非旨在代表全国情况。","lang":"en-US","units":["三城","800人","非全国代表"]},{"source":"Younger respondents paid more attention to packaging, while price remained important across age groups.","answer":"年轻受访者更关注包装，而各年龄段受访者仍然重视价格。","lang":"en-US","units":["年轻受访者","包装","所有年龄组价格重要"]},{"source":"We plan to test two new designs in selected stores before changing all our products.","answer":"我们计划先在部分门店测试两种新设计，再考虑调整全部产品。","lang":"en-US","units":["计划","部分门店","两设计","全面调整之前"]},{"source":"We will measure repeat purchases as well as initial sales. Higher awareness alone is not enough.","answer":"我们将同时考察重复购买和初次销售情况。只有知名度提高还不够。","lang":"en-US","units":["复购","初销","知名度单独不足"]}],"origin":"自编训练"},{"id":"O10","theme":"culture","title":"双语展览开幕致辞","kind":"汉译英篇章","segments":[{"source":"欢迎各位来到本次展览。我们通过实物、照片和口述历史介绍茶马古道。","answer":"Welcome to the exhibition. We introduce the Tea Horse Road through objects, photographs and oral histories.","lang":"zh-CN","units":["欢迎","实物照片口述历史","茶马古道"]},{"source":"展品展示了区域贸易的联系，也反映了当地居民的知识与经验。","answer":"The exhibits show connections in regional trade and reflect local residents’ knowledge and experience.","lang":"zh-CN","units":["区域贸易联系","当地知识经验"]},{"source":"双语介绍旨在帮助更多观众理解这些材料，而不是替代原有故事。","answer":"The bilingual descriptions aim to help more visitors understand these materials, rather than replace the original stories.","lang":"zh-CN","units":["双语介绍","帮助理解","不替代故事"]},{"source":"感谢社区成员与研究人员的参与。我们期待继续听取他们的意见。","answer":"We thank community members and researchers for taking part and look forward to hearing more of their views.","lang":"zh-CN","units":["感谢社区研究者","参与","继续听取意见"]}],"origin":"自编训练"},{"id":"O11","theme":"product","title":"工厂参观说明","kind":"英译汉篇章","segments":[{"source":"This line can produce twelve thousand units a month. At present, we are using eighty percent of that capacity.","answer":"这条生产线每月可生产1.2万件，目前产能利用率为80%。","lang":"en-US","units":["月产能1.2万","目前80%"]},{"source":"Every batch is checked before shipment. Defective items are separated and recorded.","answer":"每批货物在装运前都会接受检查。有缺陷的产品将被单独存放并登记。","lang":"en-US","units":["每批","装运前","缺陷品分开登记"]},{"source":"We recently introduced new equipment, but staff training remains essential to quality control.","answer":"我们最近引入了新设备，但员工培训对质量控制仍然十分重要。","lang":"en-US","units":["最近新设备","培训","质量控制重要"]},{"source":"Please follow the marked route during the visit. Photography is allowed only in designated areas.","answer":"参观时请沿标示路线行走，仅可在指定区域拍照。","lang":"en-US","units":["标示路线","仅指定区域拍照"]}],"origin":"自编训练"},{"id":"O12","theme":"green","title":"循环包装试点说明","kind":"汉译英篇章","segments":[{"source":"我们正在三个城市试用可重复使用的包装，试点为期六个月。","answer":"We are testing reusable packaging in three cities over a six-month pilot period.","lang":"zh-CN","units":["三城","可重复包装","六个月"]},{"source":"目前的记录显示，每批货物的包装废弃物有所减少。","answer":"Current records show a reduction in packaging waste per shipment.","lang":"zh-CN","units":["目前记录","每批","废物减少"]},{"source":"不过，回运和清洗所消耗的能源还没有全部计入。","answer":"However, the energy used for return transport and cleaning has not yet been fully included.","lang":"zh-CN","units":["转折","回运清洗能源","尚未全部计入"]},{"source":"我们会在收集更多数据之后，再评估整个系统的环境影响。","answer":"We will assess the environmental impact of the whole system after collecting more data.","lang":"zh-CN","units":["更多数据之后","全系统","环境影响评估"]}],"origin":"自编训练"}],"numbers":[{"id":"N01","source":"1.2 million","answer":"120万","note":"million为百万，换为万时乘100。"},{"id":"N02","source":"35 million yuan","answer":"3500万元","note":"保留人民币币种。"},{"id":"N03","source":"2.6 billion US dollars","answer":"26亿美元","note":"billion为十亿。"},{"id":"N04","source":"450,000 units","answer":"45万件","note":"单位units按产品语境译。"},{"id":"N05","source":"0.75 million","answer":"75万","note":"小数乘百万。"},{"id":"N06","source":"8.04 billion yuan","answer":"80.4亿元","note":"换算后再检查十亿与亿。"},{"id":"N07","source":"120万元","answer":"1.2 million yuan","note":"中文万转英文million时除100。"},{"id":"N08","source":"3.5亿元","answer":"350 million yuan","note":"1亿等于100 million。"},{"id":"N09","source":"26亿美元","answer":"2.6 billion US dollars","note":"10亿为1 billion。"},{"id":"N10","source":"4500万件","answer":"45 million units","note":"件数与币种不要混同。"},{"id":"N11","source":"0.8亿元","answer":"80 million yuan","note":"0.8亿为8000万。"},{"id":"N12","source":"12.6万人","answer":"126,000 people","note":"人数不可丢失千位。"},{"id":"N13","source":"from 10% to 12%","answer":"从10%升至12%，提高2个百分点","note":"相对增幅20%，不是2%。"},{"id":"N14","source":"down by 15% to 170","answer":"下降15%，降至170","note":"by是变化幅度，to是终值。"},{"id":"N15","source":"up by 25% from 80","answer":"从80增加25%，增至100","note":"80×1.25=100。"},{"id":"N16","source":"50 basis points","answer":"50个基点，即0.5个百分点","note":"100个基点等于1个百分点。"},{"id":"N17","source":"a 20% discount","answer":"八折，即优惠20%","note":"不是二折。"},{"id":"N18","source":"three quarters of the budget","answer":"预算的四分之三","note":"75%。"},{"id":"N19","source":"增长到原来的两倍","answer":"double the original level","note":"增至两倍相当于增长100%。"},{"id":"N20","source":"比上年减少四分之一","answer":"down by a quarter from the previous year","note":"保留比较基准。"},{"id":"N21","source":"同比增长6.2%","answer":"up 6.2% year on year","note":"不要误作环比。"},{"id":"N22","source":"环比增长3%（季度）","answer":"up 3% quarter on quarter","note":"明确季度比较。"},{"id":"N23","source":"more than 12,000","answer":"超过1.2万","note":"不改成约1.2万。"},{"id":"N24","source":"nearly 200 million","answer":"近2亿","note":"接近但未达到，保留nearly。"},{"id":"N25","source":"at least 500 units","answer":"至少500件","note":"包含500。"},{"id":"N26","source":"no more than 30 days","answer":"不超过30天","note":"包含30。"},{"id":"N27","source":"less than 10%","answer":"低于10%","note":"不包含10%。"},{"id":"N28","source":"up to 50%","answer":"最高达50%","note":"不表示所有情形均为50%。"},{"id":"N29","source":"1.5 tonnes","answer":"1.5吨，即1500千克","note":"tonne为公吨。"},{"id":"N30","source":"750 grams","answer":"750克，即0.75千克","note":"不要误成750千克。"},{"id":"N31","source":"three shipments of 400 units each","answer":"分三批装运，每批400件","note":"合计1200件。"},{"id":"N32","source":"within five working days of receipt","answer":"收到后五个工作日内","note":"保留起算点与工作日。"},{"id":"N33","source":"by the end of June","answer":"截至6月底或6月底前","note":"按已发生或待完成语境判断。"},{"id":"N34","source":"in the first three quarters","answer":"前三季度","note":"不是第三季度。"},{"id":"N35","source":"two to three weeks","answer":"两至三周","note":"是范围，不是五周。"},{"id":"N36","source":"USD 8 per kilogram","answer":"每千克8美元","note":"单价币种与计量单位同时保留。"}],"pitfalls":[{"id":"F01","title":"归因丢失","source":"据公司初步估计，需求可能回升。","bad":"Demand will recover.","answer":"According to the company’s preliminary estimate, demand may recover.","note":"信息来源、初步性质和可能性都丢失了。"},{"id":"F02","title":"百分点混淆","source":"份额从10%升至12%。","bad":"Its share rose by 2 percent.","answer":"Its share rose from 10% to 12%, an increase of two percentage points.","note":"相对增幅是20%，份额差为2个百分点。"},{"id":"F03","title":"收入利润混淆","source":"Revenue increased, but profit declined.","bad":"利润增加了，但收益下降了。","answer":"收入增加了，但利润下降了。","note":"revenue与profit分别核对。"},{"id":"F04","title":"终值增幅混淆","source":"Sales rose by 10% to 220 units.","bad":"销量上升了220件。","answer":"销量增长10%，达到220件。","note":"by和to的功能不同。"},{"id":"F05","title":"生豆误解","source":"The cooperative sells green coffee beans.","bad":"合作社出售绿色认证咖啡豆。","answer":"合作社出售咖啡生豆。","note":"green coffee是未烘焙咖啡，未提供认证信息。"},{"id":"F06","title":"主体替换","source":"The subsidiary signed the contract.","bad":"母公司签署了合同。","answer":"子公司签署了合同。","note":"签约主体不可替换。"},{"id":"F07","title":"权利变义务","source":"Either party may terminate the agreement.","bad":"双方必须终止协议。","answer":"任何一方均可终止协议。","note":"either party和may都被误译。"},{"id":"F08","title":"条件遗漏","source":"Discounts apply only to prepaid orders.","bad":"所有订单均可享受折扣。","answer":"折扣仅适用于预付货款的订单。","note":"only限制适用范围。"},{"id":"F09","title":"例外遗漏","source":"Unless otherwise agreed in writing, the price is fixed.","bad":"价格绝对不能更改。","answer":"除非另有书面约定，价格为固定价格。","note":"保留书面约定这一例外。"},{"id":"F10","title":"装运到达混淆","source":"Payment is due before shipment.","bad":"货到后付款。","answer":"应在装运前付款。","note":"节点与先后关系同时错误。"},{"id":"F11","title":"预付款定金混淆","source":"A 20% advance payment is required.","bad":"须付20%的定金并适用双倍返还。","answer":"须支付20%的预付款。","note":"不自行加入法律效果。"},{"id":"F12","title":"费用风险混淆","source":"The seller pays the freight.","bad":"风险一直由卖方承担到目的地。","answer":"卖方支付运费。","note":"单独一句费用安排不足以推导全部风险分配。"},{"id":"F13","title":"所有部分混淆","source":"The programme covers direct suppliers only.","bad":"项目覆盖整个供应链。","answer":"项目仅覆盖直接供应商。","note":"范围扩大改变了事实。"},{"id":"F14","title":"预测变事实","source":"Analysts expect a gradual recovery.","bad":"市场已经全面复苏。","answer":"分析人士预计将逐步复苏。","note":"来源、时态、范围、程度都不能强化。"},{"id":"F15","title":"相关变因果","source":"Complaints fell during the trial.","bad":"该设备消除了投诉。","answer":"试用期间，投诉减少了。","note":"同时发生不自动构成因果或完全消除。"},{"id":"F16","title":"数字约数化","source":"More than 12,000 firms attended.","bad":"约1.2万家企业参加。","answer":"超过1.2万家企业参加。","note":"more than不是about。"},{"id":"F17","title":"核验认证混淆","source":"The report has not been independently verified.","bad":"该报告已获得国际认证。","answer":"该报告尚未经独立核验。","note":"不要补造认证。"},{"id":"F18","title":"增长放缓误读","source":"Growth is expected to slow.","bad":"预计经济将萎缩。","answer":"预计经济增速将放缓。","note":"增速放缓不一定是负增长。"},{"id":"F19","title":"折扣反向","source":"a 10% discount","bad":"一折","answer":"九折或优惠10%","note":"中文折扣表达按保留原价比例计算。"},{"id":"F20","title":"否定范围错误","source":"Not all customers requested refunds.","bad":"所有顾客都没要求退款。","answer":"并非所有顾客都要求退款。","note":"not all与none不同。"},{"id":"F21","title":"货代承运人混淆","source":"The freight forwarder arranged transport.","bad":"承运人亲自完成了运输。","answer":"货运代理安排了运输。","note":"安排运输不等于实际承运。"},{"id":"F22","title":"经销区域扩大","source":"exclusive rights in one city","bad":"全省独家权","answer":"某一城市的独家权","note":"保留地域边界。"},{"id":"F23","title":"语体过度宣传","source":"We hope to develop regional cooperation.","bad":"我们必将开创全球合作新纪元。","answer":"我们希望发展区域合作。","note":"意愿、范围和语体均不应擅自强化。"},{"id":"F24","title":"本地知识泛化","source":"The exhibition includes oral histories from local residents.","bad":"展览收录了所有民族的完整历史。","answer":"展览包括当地居民的口述历史。","note":"不扩大样本、群体和完整性。"}],"resources":[{"id":"R01","title":"BETT官网 中英真题总入口","url":"https://m.bett.org.cn/site/term/42.html","kind":"官方真题","use":"先取初级建立题感，再按诊断结果选择中级；这是考试真题目录。","status":"已核对页面","checked":"2026-10-30"},{"id":"R02","title":"2022年下半年 初级笔译 发布页","url":"https://m.bett.org.cn/site/content/1973.html","kind":"官方真题","use":"含PDF附件；原卷注明150分钟，竞赛初赛按本届通知为120分钟。","status":"已核对页面","checked":"2026-10-30"},{"id":"R03","title":"2022年下半年 初级笔译 PDF","url":"https://houtai.bett.org.cn/upload/file/20250227/1740635716324125.pdf","kind":"PDF","use":"10句互译、2篇英译汉、2篇汉译英；无已核验的官方答案。","status":"已读取PDF","checked":"2026-10-30"},{"id":"R04","title":"2022年下半年 中级笔译 发布页","url":"https://m.bett.org.cn/site/content/1989.html","kind":"官方真题","use":"商业新闻、公司经营与财务管理材料可用于提高阶段。","status":"已核对页面","checked":"2026-10-30"},{"id":"R05","title":"2022年下半年 中级笔译 PDF","url":"https://houtai.bett.org.cn <script>

function rateTerm(t,r){const old=P().terms[t.id]||{step:0,attempts:0};let step=r===0?0:Math.max(0,Math.min(5,(old.attempts&&old.lastRating!==0?old.step:-1)+(r===2?2:1)));let mins=r===0?10:[1,3,7,14,30,60][step]*1440;P().terms[t.id]={step,lastRating:r,attempts:old.attempts+1,due:Date.now()+mins*60000,last:Date.now()};touch();studyIndex++;studyFace=false;renderStudy()}

 const bindSearch=()=>{const s=$('#lex-search'),pos=s.selectionStart;lexQ=s.value;lexLimit=60;renderLexicon();$('#lex-search').focus();$('#lex-search').setSelectionRange(pos,pos)};$('#lex-search').oninput=bindSearch;$('#lex-theme').onchange=e=>{lexTheme=e.target.value;lexLimit=60;renderLexicon()};$('#lex-filter').value=lexFilter;$('#lex-filter').onchange=e=>{lexFilter=e.target.value;lexLimit=60;renderLexicon()};$('#lex-start').onclick=()=>startStudy(lexTheme);$$('[data-term]').forEach(b=>b.onclick=()=>startStudy('', 'daily', b.dataset.term));$$('[data-star]').forEach(b=>b.onclick=()=>{toggleMistake('T:'+b.dataset.star);renderLexicon()});if($('#lex-more'))$('#lex-more').onclick=()=>{lexLimit+=60;renderLexicon()}

function writingHTML(w){const r=writingRecord(w.id);return `<div class="card"><div class="row between"><span class="badge gold">${esc(w.id)} / ${esc(w.direction)} / ${esc(w.kind)}</span><span class="timer" id="write-clock">${r.deadline?timeLeft(r.deadline):'未计时'}</span></div><p class="source-text ${w.direction==='英译汉'?'english':''}">${esc(w.source)}</p><div class="row no-print"><button class="tiny" id="write-timer">${r.deadline?'重新':'开始'}${w.kind==='句子'?'5':'25'}分钟计时</button><button class="tiny" id="write-stop">停止计时</button><button class="tiny" id="write-star">${P().mistakes['W:'+w.id]?'★ 已加入复习':'☆ 加入错题复习'}</button></div><label class="field-label" for="write-answer">你的译文　自动保存到当前浏览器</label><textarea id="write-answer" placeholder="在这里独立翻译，或手写后录入关键修订…">${esc(r.answer)}</textarea><div class="row between no-print" style="margin-top:12px"><button class="primary" id="write-reveal">${writingRevealed?'收起参考解析':'提交自查 · 查看参考解析'}</button><button class="tiny" id="write-export">导出这道题</button></div>${writingRevealed?`<div class="answer"><span class="badge">参考译文 · 可接受合理变体</span><br>${esc(w.answer)}</div><p class="notice">${esc(w.note)}</p><div class="section-title"><h3>逐项核对意义单位</h3><span>由你自评，非自动判分</span></div><div class="checklist">${w.units.map((u,i)=>`<label><input type="checkbox" data-unit="${i}" ${r.checks.includes(i)?'checked':''}>${esc(u)}</label>`).join('')}</div>${rubricHTML('writing',r.scores)}<div class="row"><button id="write-done" class="primary">${r.done?'更新完成记录':'标记完成这道题'}</button><span class="quiet" id="write-feedback">${r.checks.length} / ${w.units.length} 项已核对</span></div>`:''}</div>`}
function bindWriting(w){const r=writingRecord(w.id);$('#write-answer').oninput=e=>{r.answer=e.target.value;save()};$('#write-reveal').onclick=()=>{writingRevealed=!writingRevealed;renderWriting()};$('#write-star').onclick=()=>{toggleMistake('W:'+w.id);renderWriting()};$('#write-timer').onclick=()=>{r.deadline=Date.now()+(w.kind==='句子'?5:25)*60000;save();renderWriting()};$('#write-stop').onclick=()=>{r.deadline=null;save();renderWriting()};if(r.deadline)clockTicker=setInterval(()=>{if($('#write-clock'))$('#write-clock').textContent=timeLeft(r.deadline)},500);$('#write-export').onclick=()=>download(w.id+'-译稿.txt',[w.id+' '+themeName(w.theme),w.source,'我的译文',r.answer,'参考译文',w.answer,'核对提示',w.note].join('\n\n'),'text/plain;charset=utf-8');if(writingRevealed){$$('[data-unit]').forEach(x=>x.onchange=()=>{r.checks=$$('[data-unit]:checked').map(x=>Number(x.dataset.unit));save();$('#write-feedback').textContent=r.checks.length+' / '+w.units.length+' 项已核对'});bindRubric(r.scores);$('#write-done').onclick=()=>{r.done=true;r.completed=Date.now();touch();toast('已保存本次自查与完成记录。');renderWriting()}}}

function renderResources(){let arr=D.resources.filter(r=>resKind==='all'||(resKind==='official'?['官方真题','PDF','官方音频','MP3','往届赛事'].includes(r.kind):!['官方真题','PDF','官方音频','MP3','往届赛事'].includes(r.kind)));$('#content').innerHTML=head('VERIFIED RESOURCE DIRECTORY','真题与资源','从原始发布页出发，分清考试真题、往届赛事与拓展学习材料。')+`<details><summary>本届比赛通知要点与仍需确认的细节</summary><p><strong>初赛：</strong>${esc(D.notice.preliminary)}</p><p><strong>复赛：</strong>${esc(D.notice.semifinal)}</p><p><strong>总决赛：</strong>${esc(D.notice.final)}</p><p>${esc(D.notice.pending)}</p><p class="notice">来源：${esc(D.notice.source)}。官网2022年下半年初级笔译原卷写明150分钟，与本届初赛120分钟不同。不要照搬考试时长；网站更新时间不等于试题年份。</p></details><div class="toolbar"><select id="resource-kind" aria-label="资源分类"><option value="all">全部资源 ${D.resources.length}</option><option value="official">真题与官方音频</option><option value="extra">日常学习与教师研修</option></select><span class="quiet">核对日期 2026-10-30 · 音频未逐一试听，详情见状态</span></div><div class="card" style="padding:0">${arr.map(r=>resourceHTML(r)).join('')}</div><div class="notice">资源链接保留在原站，可能受网络、站点更新或权限影响。官方PDF已读取；MP3仅定位发布页与附件链接。自编题参考译文不是官方答案。国内日常学习可使用本地离线版；境外拓展资源无需作为必做任务。</div>`;$('#resource-kind').value=resKind;$('#resource-kind').onchange=e=>{resKind=e.target.value;renderResources()}}
function safeUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function resourceHTML(r){const url=esc(safeUrl(r.url));return `<article class="resource"><div><span class="badge gold">${esc(r.kind)}</span><div class="status" style="margin-top:9px">${esc(r.status)}</div></div><div><h4><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a></h4><p>${esc(r.use)}</p>${r.kind==='MP3'?`<audio controls preload="none" class="audio-player" src="${url}">请打开原始链接播放。</audio>`:''}<p class="status">${esc(r.checked)} 核对</p></div></article>`}
function renderTeacher(tab=contentTab){contentTab=tab;$('#content').innerHTML=head('TEACHER’S DESK','教师工具','组织训练、记录反馈、增补材料，让资源随每一届教学继续生长。')+`<div class="tabs no-print"><button id="teach-plan" class="${tab==='plan'?'selected':''}">学习与培训路线</button><button id="teach-data" class="${tab==='data'?'selected':''}">资料维护与导入</button><button id="teach-backup" class="${tab==='backup'?'selected':''}">档案与备份</button></div>${tab==='plan'?teacherPlan():tab==='data'?teacherData():teacherBackup()}`;$('#teach-plan').onclick=()=>renderTeacher('plan');$('#teach-data').onclick=()=>renderTeacher('data');$('#teach-backup').onclick=()=>renderTeacher('backup');if(tab==='data')bindTeacherData();if(tab==='backup')bindBackup();if($('#teacher-print'))$('#teacher-print').onclick=()=>print()}
function teacherPlan(){return `<div class="grid-2" style="margin:20px 0"><div class="card"><div class="eyebrow">DAILY ROUTINE</div><h3>常规备赛，每天30分钟</h3><p>10分钟词卡；10分钟句子或篇章片段；10分钟数字或口译。每周一次60—80分钟教师辅导，保留首次作答和修订后稿。</p><p>距离比赛不足两周时，优先完成官方初级真题、数字、条件和双向短交传；压缩新词，不压缩反馈。</p></div><div class="card"><div class="eyebrow">72-HOUR SPRINT</div><h3>临赛三天的安排</h3><p>第1天：官方题型与设备检查，集中修正数字和归因。第2天：一组限时笔译复测与一次只听一遍的口译。第3天：看个人错误清单，少量复现术语，模拟考场书写与录音流程。</p><p>具体赛期以校内通知为准，不按本站自动倒推日期。</p></div></div><div class="section-title"><h3>八周学习路线</h3><button id="teacher-print" class="tiny no-print">打印路线</button></div><div class="card">${D.weeks.map(w=>`<div class="week"><div class="weeknum">${String(w.week).padStart(2,'0')}</div><div><h4>${esc(w.title)}</h4><p>${esc(w.focus)}</p><p><strong>笔译：</strong>${esc(w.writing.join('、')||'按模拟测评组卷')}<br><strong>口译：</strong>${esc(w.oral.join('、'))}</p><p><strong>本周留下：</strong>${esc(w.output)}</p></div></div>`).join('')}</div><details><summary>一次80分钟辅导课怎么上</summary><p>0—10分钟：盲听数字或短对话，不先给文本；10—25分钟：对照意义单位，找出共同错误；25—45分钟：双人修订一段笔译，解释选择；45—65分钟：分段交传，交换听评；65—75分钟：同题再做一次；75—80分钟：各自写下下周最需要改进的一项。</p></details><details><summary>教师研修可分为两次90分钟</summary><p>第一次：20分钟辨别题型与素材层级；25分钟共同划分意义单位；25分钟对同一译稿独立评分后讨论分歧；20分钟确定班级可用的反馈语言。</p><p>第二次：20分钟口译源音及设备检查；30分钟看同段录音并比较评分；25分钟改编一组本地商务材料；15分钟为新材料建立来源、授权及版本记录。</p><p>评分先讨论信息变化的严重程度，再讨论文采；允许多种自然译法。涉及真实学生材料时，用化名并取得用于培训的同意。</p></details><details><summary>上传词汇书的阅读路径</summary><p>张丽莉主编《国际商务英语主题词汇》，上海交通大学出版社，2016。以下为书内印刷页码，不是PDF页序。</p>${D.book.reading.map(x=>`<p><strong>${esc(x.priority)}：</strong>${esc(x.chapters)}，第${esc(x.pages)}页。${esc(x.reason)}</p>`).join('')}<p>这本书提供词汇积累路径；数字贸易、绿色供应链及规则更新通过新材料补充。法律、机构、认证类历史表达须结合现行文件核对。</p></details>`}
function teacherData(){return `<div class="notice">本页是本地资料编辑入口，没有服务器管理员权限或班级云空间。教师导入后的内容只影响当前浏览器；分发给学生需导出资料包，或更新部署文件。</div><div class="grid-2"><div class="card"><h3>添加单个词条</h3><label class="field-label" for="new-en">英文术语</label><input id="new-en" style="width:100%" maxlength="150"><label class="field-label" for="new-zh">中文释义</label><input id="new-zh" style="width:100%" maxlength="200"><label class="field-label" for="new-note">用法提示</label><input id="new-note" style="width:100%" maxlength="500"><label class="field-label" for="new-theme">所属主题</label><select id="new-theme" style="width:100%">${D.themes.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select><button id="add-term" class="primary" style="margin-top:18px">保存到本地资料库</button></div><div class="card"><h3>批量增补与分发</h3><p>下载JSON模板，填写原创或获准使用的术语、笔译题与口译段落；每题保留稳定编号和来源说明。</p><div class="stack"><button id="sample-content">下载增补模板</button><label class="file-label">导入增补资料 JSON<input id="import-content" type="file" accept=".json,application/json"></label><button id="export-content" class="primary">导出完整资料库 JSON</button><button id="export-offline">导出含当前资料的离线网站</button></div><p>术语、笔译、口译支持按ID新增或更新。相同ID更新前会显示数量并要求确认；导入不会清除学习档案。</p></div></div><details><summary>资料编辑与质量检查约定</summary><p>先确认来源与使用范围，再核对币种、单位、日期、否定、主体、条件和例外。参考译文由教师复核并允许合理变体。官方试题、历史材料与自编题分开标注，不把未经核验的答案称为官方答案。</p><p>建议保留学年、材料ID、来源日期、编写者、复核者和修改原因。语音合成只用于训练；真人音频需单独检查时长、切分与音量。</p></details>`}
function validateContent(o){if(!o||typeof o!=='object'||Array.isArray(o))throw Error('资料必须是JSON对象');const result={};let count=0;for(const key of ['terms','writing','interpreting']){if(o[key]===undefined)continue;if(!Array.isArray(o[key])||o[key].length>2000)throw Error(key+'必须是数组，且不超过2000项');result[key]=o[key].map(x=>{if(!x||typeof x!=='object'||!x.id||typeof x.id!=='string'||x.id.length>100||!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(x.id)||['__proto__','constructor','prototype'].includes(x.id))throw Error('每项需要有效字符串id');if(!D.themes.some(t=>t.id===x.theme))throw Error(x.id+'的theme不在现有主题中');const fields=key==='terms'?['en','zh','note']:key==='writing'?['source','answer','note']:['title','kind'];for(const f of fields)if(typeof x[f]!=='string'||!x[f].trim()||x[f].length>30000)throw Error(x.id+'缺少有效字段 '+f);if(key==='writing'&&(!['句子','篇章'].includes(x.kind)||!['英译汉','汉译英'].includes(x.direction)||!Array.isArray(x.units)||!x.units.length||!x.units.every(v=>typeof v==='string'&&v.length<2000)))throw Error(x.id+'的类型、方向或意义单位格式错误');if(key==='interpreting'&&(!Array.isArray(x.segments)||!x.segments.length||x.segments.length>100||!x.segments.every(s=>s&&typeof s.source==='string'&&s.source.length<=30000&&typeof s.answer==='string'&&s.answer.length<=30000&&['en-US','zh-CN'].includes(s.lang)&&Array.isArray(s.units)&&s.units.length&&s.units.every(v=>typeof v==='string'&&v.length<2000))))throw Error(x.id+'的口译segments格式错误');count++;return JSON.parse(JSON.stringify(x))});if(new Set(result[key].map(x=>x.id)).size!==result[key].length)throw Error(key+'中有重复ID')}if(!count)throw Error('没有可导入的terms、writing或interpreting');return result}
function bindTeacherData(){$('#add-term').onclick=()=>{const en=$('#new-en').value.trim(),zh=$('#new-zh').value.trim(),note=$('#new-note').value.trim(),theme=$('#new-theme').value;if(!en||!zh||!note){toast('请填写英文、中文和用法提示。');return}D.terms.push({id:'CUSTOM-'+Date.now(),theme,en,zh,note,level:'教师增补'});writeLocal(CKEY,D);toast('词条已保存，导出完整资料库可分发给学生。');renderTeacher('data')};$('#sample-content').onclick=()=>download('BETT-资料增补模板.json',{version:'1.0',terms:[{id:'CUSTOM-TERM-001',theme:'culture',en:'local supplier',zh:'当地供应商',note:'local按上下文确定所在地。',level:'教师增补'}],writing:[{id:'CUSTOM-W-001',theme:'culture',kind:'句子',direction:'汉译英',source:'我们希望与当地供应商合作。',answer:'We hope to work with local suppliers.',units:['我们希望','当地供应商','合作'],note:'保留意愿，不改为已达成合作。',origin:'教师自编'}],interpreting:[{id:'CUSTOM-O-001',theme:'culture',title:'本地供应商介绍',kind:'双向对话',segments:[{source:'Welcome to our office.',answer:'欢迎来到我们的办公室。',lang:'en-US',units:['欢迎','我们的办公室']}],origin:'教师自编'}]});$('#import-content').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>6e6)throw Error('文件不能超过6MB');const obj=validateContent(JSON.parse(await f.text()));let added=0,updated=0;for(const k of Object.keys(obj))for(const item of obj[k])D[k].some(x=>x.id===item.id)?updated++:added++;if(!confirm(`将新增${added}项、更新${updated}项本地资料。建议先导出原资料库，继续吗？`))return;for(const k of Object.keys(obj))for(const item of obj[k]){let i=D[k].findIndex(x=>x.id===item.id);if(i<0)D[k].push(item);else D[k][i]=item}writeLocal(CKEY,D);toast('资料导入完成。');renderTeacher('data')}catch(err){toast('导入失败：'+err.message)}};$('#export-content').onclick=()=>download('BETT-完整资料库-'+localDay()+'.json',D);$('#export-offline').onclick=exportOffline}
function teacherBackup(){const c=counts();return `<div class="grid-2" style="margin-top:20px"><div class="card"><h3>当前学习档案</h3><p><strong>${esc(S.profile)}</strong><br>已接触${c.learned}词，完成笔译${c.done}题、口译${c.oral}组。</p><p>同一浏览器可建多个档案。档案名称仅作区分，没有密码保护；公用电脑请导出后清理自己的档案。</p><div class="stack"><button id="backup-export" class="primary">导出当前档案与答卷</button><label class="file-label">导入学习档案 JSON<input type="file" id="backup-import" accept=".json,application/json"></label><button id="teacher-profile">切换 / 创建学习档案</button></div></div><div class="card"><h3>迁移与离线使用</h3><p>更换设备或浏览器前，导出“学习档案”和“完整资料库”。在新设备分别导入；录音需另行保存。</p><p>网页自身不提供跨设备自动同步、班级成绩汇总或AI自动评分。浏览器清理数据后，本地记录可能消失。</p><div class="stack"><button id="backup-offline">下载离线网站</button><button id="backup-reset" class="danger">清空当前档案的学习记录</button></div><p>离线网页的词卡、笔译和资料浏览可用；发音依赖设备语音，录音取决于浏览器权限。</p></div></div><details><summary>学生作业怎样交给教师</summary><p>笔译可导出单题TXT或复测答卷JSON；口译另行下载音频。教师可建立作业文件夹，按学年和化名整理。这一版不自动收集学生作业。</p><p>用于教师培训的译稿与录音先取得学生同意，去除姓名、学号等身份信息。学生档案仅包含其主动输入的名称和学习记录。</p></details>`}
function bindBackup(){$('#backup-export').onclick=()=>download('BETT-学习档案-'+localDay()+'.json',{format:'bett-progress-v1',name:S.profile,exported:new Date().toISOString(),data:P()});$('#backup-import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10e6)throw Error('文件过大');const b=JSON.parse(await f.text());if(b.format!=='bett-progress-v1'||typeof b.name!=='string'||!b.name.trim()||b.name.length>120||['__proto__','constructor','prototype'].includes(b.name)||!b.data||typeof b.data!=='object'||Array.isArray(b.data))throw Error('不是有效的学习档案');const clean=validateProgress(b.data);let name=b.name.trim();if(S.profiles[name])name+=' 导入 '+new Date().toLocaleTimeString('zh-CN');S.profiles[name]=clean;S.profile=name;save();toast('已作为独立档案导入，原档案保留。');render()}catch(err){toast('档案导入失败：'+err.message)}};$('#teacher-profile').onclick=profileDialog;$('#backup-offline').onclick=exportOffline;$('#backup-reset').onclick=()=>{if(!confirm('将清空“'+S.profile+'”的所有学习、答卷和自评记录。此操作无法撤回，请先导出备份。继续吗？'))return;S.profiles[S.profile]=newProfile();save();studyQueue=[];mockActive=null;toast('当前档案已清空。');renderTeacher('backup')}}
function validateProgress(data){const base=newProfile();for(const k of Object.keys(base)){if(data[k]!==undefined){if(!data[k]||typeof data[k]!=='object'||Array.isArray(data[k]))throw Error('字段'+k+'格式错误');base[k]=JSON.parse(JSON.stringify(data[k]))}}for(const [k,v]of Object.entries(base.terms)){if(!v||![v.step,v.attempts,v.due].every(Number.isFinite)||v.step<0||v.step>5||v.attempts<0)throw Error('术语进度格式错误')}for(const v of Object.values(base.writing)){if(!v||typeof v.answer!=='string'||!Array.isArray(v.checks)||!v.scores||typeof v.scores!=='object')throw Error('笔译档案格式错误')}for(const v of Object.values(base.oral)){if(!v||typeof v.note!=='string'||!v.checks||typeof v.checks!=='object'||!v.scores||typeof v.scores!=='object')throw Error('口译档案格式错误')}for(const v of Object.values(base.mocks)){if(!v||!Number.isFinite(v.deadline)||!v.answers||typeof v.answers!=='object')throw Error('复测档案格式错误')}for(const v of Object.values(base.activity))if(!Number.isFinite(v)||v<0)throw Error('学习统计格式错误');return base}
function exportOffline(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#initial-data').textContent=JSON.stringify(D).replace(/<\//g,'<\\/');clone.querySelector('#content').innerHTML='';clone.querySelector('#toast').classList.add('hide');clone.querySelector('#dialog').innerHTML='';clone.querySelector('#dialog').removeAttribute('open');clone.querySelector('#sidebar').classList.remove('open');download('BETT-商务译练-离线版.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('离线网站已下载；个人进度请另行导出。')}
function profileDialog(){const dlg=$('#dialog');dlg.innerHTML=`<h3>学习档案</h3><p>当前设备的记录相互独立。新建档案可用于不同学年或不同学习者。</p><div class="stack">${Object.keys(S.profiles).map((name,i)=>`<button data-profile-index="${i}" ${name===S.profile?'class="primary"':''}>${esc(name)}${name===S.profile?' · 当前':''}</button>`).join('')}</div><label class="field-label" for="profile-new">新档案名称</label><input id="profile-new" maxlength="60" placeholder="例如 2027届备赛 小组A" style="width:100%"><div class="row" style="margin-top:18px"><button id="profile-create" class="primary">创建并切换</button><button id="profile-close">关闭</button></div>`;dlg.showModal();const switchTo=name=>{cancelOral();S.profile=name;save();studyQueue=[];studyIndex=0;mockActive=null;oralUsed.clear();dlg.close();render()};$$('[data-profile-index]').forEach(b=>b.onclick=()=>switchTo(Object.keys(S.profiles)[Number(b.dataset.profileIndex)]));$('#profile-create').onclick=()=>{const name=$('#profile-new').value.trim();if(!name){toast('请填写档案名称。');return}if(['__proto__','constructor','prototype'].includes(name)){toast('请换一个档案名称。');return}if(S.profiles[name]){toast('名称已存在，请直接选择该档案。');return}S.profiles[name]=newProfile();switchTo(name)};$('#profile-close').onclick=()=>dlg.close()}
$('#menu-toggle').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',String(open))};$('#profile-btn').onclick=profileDialog;
